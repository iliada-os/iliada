<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Search</title>
  <defs>
    <linearGradient id="il-bronze" x1="58" y1="58" x2="188" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6D38E"/>
      <stop offset="0.45" stop-color="#DDA34E"/>
      <stop offset="1" stop-color="#A5671F"/>
    </linearGradient>
    <linearGradient id="il-crest" x1="48" y1="34" x2="218" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE5442"/>
      <stop offset="0.55" stop-color="#CF3228"/>
      <stop offset="1" stop-color="#9E1F18"/>
    </linearGradient>
    <radialGradient id="sp-glass" cx="96" cy="92" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A6BB0"/>
      <stop offset="0.55" stop-color="#22396A"/>
      <stop offset="1" stop-color="#14254A"/>
    </radialGradient>
    <linearGradient id="sp-handle" x1="150" y1="210" x2="210" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A5418"/>
      <stop offset="0.5" stop-color="#DDA34E"/>
      <stop offset="1" stop-color="#F6D38E"/>
    </linearGradient>
    <filter id="il-drop" filterUnits="userSpaceOnUse" x="-20" y="-20" width="296" height="300">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b1"/>
      <feOffset in="b1" dy="8" result="o1"/>
      <feComponentTransfer in="o1" result="s1"><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b2"/>
      <feOffset in="b2" dy="2" result="o2"/>
      <feComponentTransfer in="o2" result="s2"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#il-drop)">
    <g transform="translate(128 124) scale(1.0888) translate(-129.00 -129.00)">
<!-- Spotlight: a short, heavy bronze magnifier, its lens Aegean glass. -->
  <path stroke="url(#sp-handle)" stroke-width="36" stroke-linecap="round" d="M156 156 L200 200"/>
  <path stroke="url(#il-crest)" stroke-width="40" stroke-linecap="butt" d="M150 150 L162 162"/>
  <circle cx="110" cy="110" r="58" fill="url(#sp-glass)" stroke="url(#il-bronze)" stroke-width="24"/>
  <circle cx="110" cy="110" r="46.5" fill="none" stroke="#8A5418" stroke-width="2.5" opacity="0.55"/>
  <path fill="none" stroke="#FFF1CC" stroke-width="3" stroke-linecap="round" opacity="0.55" d="M55 94 A70 70 0 0 1 94 55"/>
  <path fill="#FFFFFF" opacity="0.32" d="M74 104 A38 38 0 0 1 104 74 A44 44 0 0 0 84 108 Z"/>
  <circle cx="134" cy="132" r="5" fill="#FFFFFF" opacity="0.22"/>

    </g>
  </g>
</svg>
