<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- The boot menu's background: deep navy, lit softly from above. -->
  <defs>
    <radialGradient id="glow" cx="960" cy="380" r="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22396A"/>
      <stop offset="0.45" stop-color="#14254A"/>
      <stop offset="1" stop-color="#0B1630"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- A thin bronze rule above the hints at the bottom. -->
  <rect x="810" y="986" width="300" height="2" rx="1" fill="#DDA34E" opacity="0.35"/>
</svg>
