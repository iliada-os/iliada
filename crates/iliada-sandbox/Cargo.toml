[package]
name = "iliada-sandbox"
description = "Iliada sandbox controller: Tier-1 namespace sandboxes and Tier-2 cloud-hypervisor micro-VMs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
iliada-types.workspace = true
iliada-bundle.workspace = true
iliada-ipc.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "net", "io-util", "time", "rt"] }
async-trait.workspace = true
tracing.workspace = true
# Sandboxed apps get a display socket of their own (wp-security-context-v1).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
