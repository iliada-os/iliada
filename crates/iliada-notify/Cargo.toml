[package]
name = "iliada-notify"
description = "Iliada's Notification Center: history, per-app rules and Do Not Disturb, shared by the notification service, the panel, Settings, the CLI and Homer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No D-Bus here: Settings builds this crate inside COSMIC Settings, so it
# stays small. The service that owns org.freedesktop.Notifications is
# iliada-notifyd.

[dependencies]
iliada-types.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
