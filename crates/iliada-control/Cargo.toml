[package]
name = "iliada-control"
description = "Homer's hands: lets the assistant read and use other apps (accessibility, screen and input, Chrome), gated, shown and logged."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "iliada-control"
path = "src/main.rs"

[dependencies]
iliada-bundle.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
command-fds = { version = "0.3", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
