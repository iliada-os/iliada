[package]
name = "iliada-notifyd"
description = "Iliada's notification service: owns org.freedesktop.Notifications, keeps the Notification Center's history, applies Do Not Disturb and the per-app rules, and hands banners to COSMIC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "iliada-notifyd"
path = "src/main.rs"

[dependencies]
iliada-notify.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

[lints]
workspace = true
