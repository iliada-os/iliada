# Heavier check: build the x86-64 dev VM, boot it under QEMU/KVM, wait for the
# COSMIC desktop, and store screenshots. Main and the Actions tab only — not
# every pull request. Substituters are read-only. No secrets.
name: Dev VM

on:
  push:
    branches: [main]
  # Not every pull request: only when the boot path itself changed, so a PR
  # that introduces or edits this workflow can prove the desktop comes up.
  pull_request:
    paths:
      - ".github/workflows/vm.yml"
      - "scripts/ci-boot-vm.sh"
      - "nix/hosts/dev-vm.nix"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 1
          test -e /dev/kvm || { echo "/dev/kvm is missing"; exit 1; }
          test -w /dev/kvm || { echo "/dev/kvm is not writable"; ls -l /dev/kvm; exit 1; }
          ls -l /dev/kvm

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.iliada-os.com
            extra-trusted-public-keys = cache.iliada-os.com-1:m3Nzs56JqFzorWcJP9N49LnaeHNyzdodpQE26xtwQXk=

      - name: Show Nix substituters
        run: nix config show | grep -E 'substituters|trusted-public-keys' || true

      - name: Disk space before the build
        run: df -h

      - name: Build the dev VM
        run: nix build -L .#nixosConfigurations.dev-vm-x86_64.config.system.build.vm --out-link result-vm

      - name: Disk space after the build
        run: df -h

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Boot the VM, wait for the desktop, screenshot
        run: bash scripts/ci-boot-vm.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          if-no-files-found: warn
          path: |
            vm-run/*.png
            vm-run/*.ppm
            vm-run/*.log
            vm-run/*.txt
