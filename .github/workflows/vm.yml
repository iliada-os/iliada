# Heavier check: build the x86-64 CI VM, boot it under QEMU/KVM, wait for the
# COSMIC desktop, and store screenshots. Main, the Actions tab, and PRs that
# change the boot path — not every pull request.
#
# Substituters: cache.iliada-os.com + cache.nixos.org. On push to main in
# iliada-os/iliada only, the built closure is signed and uploaded so later
# runs do not recompile COSMIC. Pull requests and forks never upload.
name: Dev VM

on:
  push:
    branches: [main]
  # Not every pull request: only when the boot path itself changed, so a PR
  # that introduces or edits this workflow can prove the desktop comes up.
  pull_request:
    paths:
      - ".github/workflows/vm.yml"
      - "scripts/ci-boot-vm.sh"
      - "scripts/ci-push-cache.sh"
      - "nix/hosts/dev-vm.nix"
      - "nix/hosts/dev-vm-ci.nix"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 1
          test -e /dev/kvm || { echo "/dev/kvm is missing"; exit 1; }
          test -w /dev/kvm || { echo "/dev/kvm is not writable"; ls -l /dev/kvm; exit 1; }
          ls -l /dev/kvm

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.iliada-os.com
            extra-trusted-public-keys = cache.iliada-os.com-1:m3Nzs56JqFzorWcJP9N49LnaeHNyzdodpQE26xtwQXk=

      - name: Show Nix substituters
        run: nix config show | grep -E 'substituters|trusted-public-keys' || true

      - name: Disk space before the build
        run: df -h

      - name: Build the dev VM
        run: nix build -L .#nixosConfigurations.dev-vm-ci-x86_64.config.system.build.vm --out-link result-vm

      - name: Disk space after the build
        run: df -h

      - name: Upload the built closure to cache.iliada-os.com
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'iliada-os/iliada'
        env:
          ILIADA_CACHE_KEY: ${{ secrets.ILIADA_CACHE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci-push-cache.sh "$(readlink -f result-vm)"

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Boot the VM, wait for the desktop, screenshot
        run: bash scripts/ci-boot-vm.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          if-no-files-found: warn
          path: |
            vm-run/*.png
            vm-run/*.ppm
            vm-run/*.log
            vm-run/*.txt
